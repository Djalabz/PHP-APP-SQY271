<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - E-Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-8">Mon Panier</h2>

        <div class="lg:grid lg:grid-cols-12 lg:gap-x-12">
            <!-- Cart Items -->
            <div class="lg:col-span-7 space-y-4">
                <!-- Cart Item -->
                <div class="flex rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
                    <img src="https://fakestoreapi.com/img/81fPKd-2AYL._AC_SL1500_.jpg" alt="Produit" class="h-24 w-24 rounded-md object-cover flex-shrink-0">
                    <div class="ml-6 flex-1">
                        <div class="flex justify-between">
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900">Fjallraven - Foldsack No. 1 Backpack</h3>
                                <p class="text-sm text-gray-500 mt-1">109.95 €</p>
                            </div>
                            <button class="text-gray-400 hover:text-gray-500">
                                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <input type="number" value="1" min="1" class="mt-4 w-20 rounded-md border border-gray-300 px-3 py-1 text-sm">
                    </div>
                </div>

                <!-- Cart Item -->
                <div class="flex rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
                    <img src="https://fakestoreapi.com/img/71-3HjGNDUL._AC_SY879._SX._UX._SY._UY_.jpg" alt="Produit" class="h-24 w-24 rounded-md object-cover flex-shrink-0">
                    <div class="ml-6 flex-1">
                        <div class="flex justify-between">
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900">Mens Casual Premium Slim Fit T-Shirts</h3>
                                <p class="text-sm text-gray-500 mt-1">22.30 €</p>
                            </div>
                            <button class="text-gray-400 hover:text-gray-500">
                                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <input type="number" value="2" min="1" class="mt-4 w-20 rounded-md border border-gray-300 px-3 py-1 text-sm">
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="mt-10 lg:col-span-5 lg:mt-0">
                <div class="rounded-lg border border-gray-200 bg-white px-6 py-6 shadow-sm">
                    <h3 class="text-lg font-semibold text-gray-900 mb-6">Résumé</h3>
                    
                    <div class="space-y-4">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">Sous-total</span>
                            <span class="font-medium">188.24 €</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">Livraison</span>
                            <span class="font-medium">Gratuite</span>
                        </div>
                        <div class="flex justify-between border-t border-gray-200 pt-4">
                            <span class="font-semibold">Total</span>
                            <span class="font-semibold">188.24 €</span>
                        </div>
                    </div>

                    <button class="mt-6 w-full rounded-md bg-indigo-600 px-4 py-3 text-sm font-semibold text-white hover:bg-indigo-500">
                        Passer la commande
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
